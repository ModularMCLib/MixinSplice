# 检查源码格式。
name: Java Formatting

on:
  push:
    branches: ['main']
    paths:
      - '**/src/*/java/**'
      - '**/src/*/kotlin/**'
      - '**/src/*/resources/**'
      - 'gradle/scripts/spotless.gradle'
      - 'gradle/spotless/**'
  pull_request:
    paths: ['**']

concurrency:
  group: formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Spotless 的 ratchetFrom 需要完整提交历史。
      - name: Check Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/src/*/java/**'
              - '**/src/*/kotlin/**'
              - '**/src/*/resources/**'
              - 'gradle/scripts/spotless.gradle'
              - 'gradle/spotless/**'
      - name: Setup Build
        if: steps.filter.outputs.code == 'true'
        uses: ./.github/actions/build_setup
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Spotless Formatting Check with Gradle
        if: steps.filter.outputs.code == 'true'
        run: ./gradlew spotlessCheck --warning-mode all
