  # 发布成功后，通过 PR 更新版本号和变更日志。
  bump-version-and-changelog:
    name: Bump Version and Build Changelog
    needs: [ build, upload-release-artifacts ]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump Version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "gh/release-${RELEASE_VERSION}"
          CURRENT=$(sed -n 's/^mod_version = //p' gradle.properties)
          if [[ "$CURRENT" != "$RELEASE_VERSION" ]]; then
            echo "main is at $CURRENT, expected released version $RELEASE_VERSION" >&2
            exit 1
          fi
          BUMPED=$(printf '%s\n' "$RELEASE_VERSION" | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.)
          sed -i "s/^mod_version = .*/mod_version = ${BUMPED}/" gradle.properties
          git commit -am "Bump version to ${BUMPED}"
      - name: Prepend to CHANGELOG
        if: inputs.changelog-body
        env:
          CHANGELOG_BODY: ${{ inputs.changelog-body }}
        run: |
          { head -n 1 CHANGELOG.md; printf '\n%s\n' "$CHANGELOG_BODY"; tail -n +2 CHANGELOG.md; } > temp.md && mv temp.md CHANGELOG.md
          git commit -am "Updated CHANGELOG"
      - name: Push and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force --set-upstream origin "gh/release-${RELEASE_VERSION}"
          gh pr create --base main --head "gh/release-${RELEASE_VERSION}" --title "RELEASE for ${RELEASE_VERSION} [no-snapshot]" --body "Created by GH Workflow" --label "ignore changelog"
