# 合并前检查 PR 标签。
name: Pull Request Labels

# PR 完成审查或被添加标签时执行检查。
on:
  pull_request:
    types: [opened, labeled, unlabeled]

concurrency:
  group: pr-labels-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: Label Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # required-labels 需要读取 PR。
    steps:
      - name: Check for Merge-Blocking Labels # 存在阻止合并的标签时，检查失败。
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 0
          labels: 'do not merge, admin merge'
          exit_type: failure

      - name: Check for Required Type Labels # 至少需要一个类型标签。
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: 'type: feature, type: bugfix, type: refactor, type: translation, type: tests, ignore changelog'
          exit_type: failure

      - name: Check for Required Release Label # 必须恰好有一个发布标签。
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 1
          labels: 'release: api - X.0.0, release: major - 0.X.0, release: Patch - 0.0.X, release: stale'
          exit_type: failure
          
