name: Test pull request on push

on:
  pull_request:
    paths: ['**']

# PR 收到新提交时取消上一轮任务。
concurrency:
  group: PR-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION_SUFFIX: "PR-${{ github.event.number }}"
    steps:
      - uses: actions/checkout@v4
      - name: Check Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/src/**'
              - '**/*.gradle'
              - 'gradle.properties'
              - 'gradlew*'
              - 'gradle/**'
              - '.github/workflows/test-on-push.yml'
      - name: Setup Build
        if: steps.filter.outputs.code == 'true'
        uses: ./.github/actions/build_setup
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Fabric server tests
        if: steps.filter.outputs.code == 'true'
        id: fabric
        run: ./gradlew :loader:fabric:runGameTestServer
      - name: Run Forge server tests
        if: ${{ !cancelled() && (steps.fabric.outcome == 'success' || steps.fabric.outcome == 'failure') }}
        run: ./gradlew :loader:forge:runTestGameTestServer
      - name: Run NeoForge GameTests
        if: ${{ !cancelled() && (steps.fabric.outcome == 'success' || steps.fabric.outcome == 'failure') }}
        run: ./gradlew :loader:neoforge:runGameTestServer
      - name: Run JVM tests
        if: ${{ !cancelled() && (steps.fabric.outcome == 'success' || steps.fabric.outcome == 'failure') }}
        id: jvm
        run: ./gradlew :tests:test --rerun
      - name: Update “Tests Passed” / “Tests Failed” labels
        if: >-
          !cancelled() && (steps.jvm.outcome == 'success' || steps.jvm.outcome == 'failure') &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const [add, remove] = {
              success: ['Tests: Passed','Tests: Failed'],
              failure: ['Tests: Failed','Tests: Passed']
            }['${{ job.status }}'];

            const { owner, repo }    = context.repo;
            const issue_number       = context.payload.pull_request.number;

            await github.rest.issues
              .addLabels({ owner, repo, issue_number, labels: [add] })
              .catch(() => {});

            await github.rest.issues
              .removeLabel({ owner, repo, issue_number, name: remove })
              .catch(() => {});
