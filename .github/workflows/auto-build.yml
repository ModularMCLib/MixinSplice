name: Latest Build

on:
  push:
    branches: ['main', '[0-9]+.x']
    paths: ['**/src/**', '**/*.gradle', 'gradle.properties', 'gradle/**', 'gradlew*']

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PUBLISH: ${{ !contains(github.event.commits[0].message, '[no-snapshot]') }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      SNAPSHOT: true
      CI: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Spotless 的 ratchetFrom 需要完整提交历史。
      - name: Setup Build
        uses: ./.github/actions/build_setup
        with:
          ref: ${{ github.sha }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Get Mod Version
        id: ver
        run: |
          version=$(./gradlew -q --configure-on-demand :printVersion)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Version Suffix
        id: suffix
        run: echo "VERSION_SUFFIX=$(echo "${{ github.sha }}" | cut -c 1-7)" >> $GITHUB_ENV
      - name: Build
        run: ./gradlew build
      - name: Publish to Maven
        if: ${{ github.repository_owner == 'ModularMCLib' && env.PUBLISH == 'true' }}
        run: ./gradlew publish
      - name: Rename Jars
        if: ${{ env.PUBLISH == 'true' }}
        run: for file in build/libs/*; do mv "$file" "${file/SHOT/SHOT+$(date --utc '+%Y%m%d-%H%M%S')-${{ env.VERSION_SUFFIX }}}"; done;
      - name: Upload Artifacts
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*
          if-no-files-found: error
          retention-days: 90
      - name: Changelog
        id: changelog
        if: ${{ env.PUBLISH == 'true' && !github.event.created }}
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: "./.github/json/config-latest.json"
          fromTag: ${{ github.event.before }}
          toTag: ${{ github.sha }}
          fetchViaCommits: true
          failOnError: false
      - name: Release Latest
        if: ${{ env.PUBLISH == 'true' }}
        uses: andelf/nightly-release@46e2d5f80828ecc5c2c3c819eb31186a7cf2156c
        with:
          tag_name: latest-${{ github.ref_name }}
          name: 'MixinSplice ${{ steps.ver.outputs.version }} SNAPSHOT ${{ env.VERSION_SUFFIX }}'
          prerelease: true
          body: |
            The latest build of MixinSplice from `${{ github.ref_name }}` for Fabric, Forge, and NeoForge.
            Please report any [issues](${{ github.server_url }}/${{ github.repository }}/issues).
            ${{ steps.changelog.outputs.changelog }}
          files: build/libs/*.jar
