pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = "https://maven.quiltmc.org/repository/release" }
        maven {
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex('net[.]fabricmc([.].*)?') }
        }
        maven {
            url = 'https://maven.minecraftforge.net/'
            content { includeGroupByRegex('net[.]minecraftforge([.].*)?') }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'Minecraft Libraries'
            url = 'https://libraries.minecraft.net/'
            content { includeGroup('com.mojang') }
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content { includeGroup('net.fabricmc') }
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
            content { includeGroup('net.minecraftforge') }
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/maven/'
            content {
                includeModule('org.spongepowered', 'mixin')
            }
        }
    }
}

rootProject.name = "${mod_id}"

include 'api', 'core'
include 'loader:fabric', 'loader:forge', 'loader:neoforge'
include 'tests'
