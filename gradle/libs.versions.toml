[versions]
minecraft = "1.21.1"
neoForge = "21.1.265"
neoForgeMinimum = "21.1.26"
fabricLoader = "0.20.1"
fabricLoaderMinimum = "0.16.0"
forgeLoader = "1.21-51.0.33"
forgeLoaderMinimum = "51.0.33"
loader = "4"
parchment = "2024.11.17" # https://parchmentmc.org/docs/getting-started
spotless = "8.11.0"
neoGradle = "7.1.39"
mixin = "0.8.7"
asm = "9.8"
jspecify = "1.0.0"
junit = "5.14.2"
guava = "32.1.2-jre"
maven-artifact = "3.8.5"

[libraries]
minecraft               = { module = "com.mojang:minecraft", version.ref = "minecraft" }
neoForge                = { module = "net.neoforged:neoforge", version.ref = "neoForge" }
fabricLoader            = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
forge-loader            = { module = "net.minecraftforge:fmlloader", version.ref = "forgeLoader" }
forge-core              = { module = "net.minecraftforge:fmlcore", version.ref = "forgeLoader" }
forge-securemodules     = { module = "net.minecraftforge:securemodules", version = "2.2.19" }
maven-artifact          = { module = "org.apache.maven:maven-artifact", version.ref = "maven-artifact" }
mixin                   = { module = "org.spongepowered:mixin", version.ref = "mixin" }
asm-tree                = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons             = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
jspecify                = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom               = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher          = { module = "org.junit.platform:junit-platform-launcher" }
guava                   = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
neoGradle               = { id = "net.neoforged.gradle.userdev", version.ref = "neoGradle" }
spotless                = { id = "com.diffplug.spotless", version.ref = "spotless" }
