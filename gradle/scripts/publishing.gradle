import org.gradle.jvm.tasks.Jar

apply plugin: 'maven-publish'

boolean isCommon = project.path == ':core'
boolean isFabric = project.path == ':loader:fabric'
def platformArchive = isFabric ? 'remapJar' : 'jarJar'
def binaryArchive = tasks.named(isCommon ? 'jar' : platformArchive, Jar)
def sourceArchive = tasks.named(isFabric ? 'remapSourcesJar' : 'sourcesJar', Jar)

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-${isCommon ? 'common' : project.name}"
            // 游戏依赖由加载器提供，平台发行包已内嵌共享库。
            artifact(binaryArchive)
            artifact(sourceArchive)
        }
    }

    repositories {
        maven {
            name = "furyMaven"
            url = uri("https://maven.fury.io/modularmclib/")
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}
