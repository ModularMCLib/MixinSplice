plugins {
    id 'java'
    id 'maven-publish'
    //alias libs.plugins.shadow
}

configurations {
    bundledJars {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    bundledSources {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    // 发行包只收录 MixinWeaver 模块，Minecraft 和 Mixin 由 Loader 在运行时提供。
    [':api', ':core', ':integration:mixin', ':loader:neoforge'].each { module ->
        bundledJars(project(path: module, configuration: 'runtimeElements'))
        bundledSources(project(path: module, configuration: 'sourcesElements'))
    }
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
