plugins {
    id 'base'
    alias libs.plugins.spotless
}

// Share the base Maven group and snapshot version across MixinWeaver modules.
boolean isSnapshot = System.getenv("SNAPSHOT")
String buildVersion = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")

allprojects {
    group = maven_group
    version = buildVersion
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
            options.compilerArgs << "-Xlint:-removal"
        }
    }
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.named('assemble') {
    dependsOn ':distribution:neoforge:assemble'
}

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}
