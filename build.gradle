plugins {
    id 'base'
    alias libs.plugins.spotless
}

// 各模块共用 Maven 基础分组和快照版本。
boolean isSnapshot = System.getenv("SNAPSHOT")
String buildVersion = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")

allprojects {
    group = maven_group
    version = buildVersion
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
            options.compilerArgs << '-Xmaxerrs' << '2000'
            options.compilerArgs << "-Xlint:removal"
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.named('assemble') {
    dependsOn ':core:assemble', ':loader:fabric:assemble', ':loader:forge:assemble', ':loader:neoforge:assemble'
}

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}
